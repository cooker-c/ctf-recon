[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-recon"
version = "0.2.0"
description = "LLM-guided CTF recon pipeline (file/URL)"
readme = "README.md"
authors = [{name = "CTF Recon"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.12.0"]
dev = ["pytest>=8.0", "mypy>=1.8"]

[project.scripts]
ctf-recon = "ctf_recon:main"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["ctf_recon"]
