[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-recon"
version = "0.2.0"
description = "LLM-guided CTF recon pipeline (file/URL)"
readme = "README.md"
authors = [{name = "CTF Recon"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["ctf", "security", "recon", "forensics", "pwn", "web", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.optional-dependencies]
llm = ["openai>=1.12.0"]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.4.0", "bandit>=1.7.8"]

[project.scripts]
ctf-recon = "ctf_recon:main"

[project.urls]
Homepage = "https://github.com/cooker-c/ctf-recon"
Issues = "https://github.com/cooker-c/ctf-recon/issues"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["ctf_recon"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S404",  # subprocess is the core purpose of this recon wrapper.
    "S603",  # command arguments are fixed by curated command templates.
    "S605",  # shell pipelines are curated and target values are shell-quoted.
    "S602",  # shell pipelines are curated and target values are shell-quoted.
    "S607",  # external CTF tools are intentionally resolved from PATH.
    "S101",  # pytest uses assert statements.
]

[tool.bandit]
skips = ["B404", "B603", "B605", "B607"]
